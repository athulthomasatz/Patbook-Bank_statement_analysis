<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded blue background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#2563EB"/>
  
  <!-- Magnifying Glass Lens -->
  <circle cx="13" cy="13" r="8" stroke="white" stroke-width="2.5" fill="none"/>
  
  <!-- Bar 1 (Short) -->
  <rect x="8.5" y="14" width="2.5" height="4" rx="0.5" fill="white"/>
  
  <!-- Bar 2 (Medium) -->
  <rect x="12" y="11" width="2.5" height="7" rx="0.5" fill="white"/>
  
  <!-- Bar 3 (Tall) -->
  <rect x="15.5" y="9" width="2.5" height="9" rx="0.5" fill="white"/>
  
  <!-- Handle -->
  <line x1="19" y1="19" x2="26" y2="26" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
</svg>