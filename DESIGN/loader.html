<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pattubook - Analyzing Statement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#a1d800",
                        "surface-dim": "#d8dadc",
                        "outline": "#777682",
                        "secondary-fixed": "#b8f600",
                        "background": "#f7f9fb",
                        "primary-fixed-dim": "#bfc2ff",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#070963",
                        "on-tertiary-container": "#ff807d",
                        "on-background": "#191c1e",
                        "surface": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "tertiary-container": "#7c0516",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#393e8e",
                        "surface-container-low": "#f2f4f6",
                        "surface-variant": "#e0e3e5",
                        "primary-container": "#2d3282",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "primary-fixed": "#e0e0ff",
                        "on-surface-variant": "#464651",
                        "inverse-surface": "#2d3133",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdad8",
                        "inverse-primary": "#bfc2ff",
                        "surface-container-highest": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed-variant": "#384e00",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c7c5d3",
                        "on-surface": "#191c1e",
                        "on-secondary-fixed": "#141f00",
                        "surface-tint": "#5156a7",
                        "tertiary": "#54000a",
                        "primary": "#15196c",
                        "error": "#ba1a1a",
                        "secondary-container": "#b6f300",
                        "secondary": "#4b6700",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-container": "#999ff5",
                        "on-secondary-container": "#4f6c00",
                        "on-tertiary-fixed-variant": "#8c1520",
                        "on-tertiary-fixed": "#410006"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-padding": "20px",
                        "xl": "32px",
                        "md": "16px",
                        "unit": "4px",
                        "lg": "24px",
                        "xxl": "48px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-sm": ["Manrope"],
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "headline-xl": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "label-md": ["Manrope"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.5px", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center font-body-md">
<!-- Main Content Canvas -->
<main class="w-full max-w-lg mx-auto p-container-padding text-center">
<!-- Loading Visual / Playful Animation Stand-in -->
<div class="relative w-64 h-64 mx-auto mb-xl">
<!-- Background Blob -->
<div class="absolute inset-0 bg-primary-fixed rounded-full opacity-50 blur-3xl"></div>
<!-- Main Document Icon -->
<div class="relative z-10 flex items-center justify-center w-full h-full bg-surface-container-lowest rounded-full shadow-[0_4px_40px_0px_rgba(45,50,130,0.08)] border border-surface-container">
<span class="material-symbols-outlined text-[80px] text-primary" data-icon="document_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<!-- Floating Data Points (Static representation of animation) -->
<div class="absolute -top-4 -right-4 bg-secondary-container text-on-secondary-container p-sm rounded-full shadow-md">
<span class="material-symbols-outlined text-xl" data-icon="pie_chart">pie_chart</span>
</div>
<div class="absolute bottom-10 -left-6 bg-primary-container text-on-primary-container p-sm rounded-full shadow-md">
<span class="material-symbols-outlined text-xl" data-icon="attach_money">attach_money</span>
</div>
<div class="absolute top-1/2 -right-8 bg-surface-container-highest text-on-surface p-xs rounded-full shadow-sm">
<span class="material-symbols-outlined text-lg" data-icon="trending_up">trending_up</span>
</div>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Polishing your statement...</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">Hang tight while we categorize your spending and weave some financial magic.</p>
<!-- Progress Bar -->
<div class="w-full max-w-sm mx-auto mb-gutter">
<div class="flex justify-between text-label-sm font-label-sm text-outline mb-xs">
<span>Analyzing data...</span>
<span>65%</span>
</div>
<div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed rounded-full" style="width: 65%;"></div>
</div>
</div>
<!-- Rotating Text / Secondary Status -->
<div class="flex items-center justify-center gap-xs text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-lg animate-spin" data-icon="sync">sync</span>
<span>Extracting merchants</span>
</div>
</main>
</body></html>
