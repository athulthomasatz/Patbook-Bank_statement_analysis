name: Bug Report
description: Report a bug or issue with the Bank Statement Analyzer
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong
      placeholder: "When I upload a PDF from X bank..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to the home page
        2. Select bank '...'
        3. Upload PDF '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: bank
    attributes:
      label: Bank
      description: Which bank statement were you using?
      options:
        - HDFC
        - Canara
        - Union Bank
        - Federal Bank
        - SBI
        - Other / Not applicable

  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: Paste any relevant debug logs from the Debug Logs section
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, browser info, or any other context
