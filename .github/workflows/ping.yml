name: Ping Render

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate RENDER_URL secret
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "❌ ERROR: RENDER_URL secret is not set."
            echo ""
            echo "Go to GitHub repo → Settings → Secrets and variables → Actions"
            echo "Add a New repository secret:"
            echo "  Name:  RENDER_URL"
            echo "  Value: https://your-service-name.onrender.com"
            echo ""
            exit 1
          fi
          echo "✅ RENDER_URL is set: $RENDER_URL"
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}

      - name: Ping Render health endpoint
        run: |
          echo "Pinging $RENDER_URL/api/health ..."
          curl -sSf --max-time 90 \
            "$RENDER_URL/api/health" \
            && echo "✅ Ping successful" \
            || (echo "❌ Ping failed"; exit 1)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
